[package]
name = "mvault"
description = "MVault — Memoro Vault as a native app, written in Rust"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "mvault"
path = "src/main.rs"

[dependencies]
mvault-core = { path = "../core" }
eframe = "0.37"
egui = "0.37"
rfd = "0.18"
arboard = "3"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp", "ico"] }
unicode-linebreak = "0.1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
serde_json = { version = "1", features = ["preserve_order"] }
zeroize = "1.8"
rayon = "1.10"
base64 = "0.22"
hayro = { version = "0.9", features = ["embed-fonts"] }
zip = { version = "9", default-features = false, features = ["deflate"] }
rqrr = "0.10"
# audio and video the system player cannot read (WebM, Matroska, Ogg), all in Rust
symphonia = { version = "0.6", default-features = false, features = ["ogg", "vorbis", "flac", "mkv", "wav", "pcm", "mp3", "aac", "isomp4"] }
symphonia-opus = "0.1"
matroska-demuxer = "0.8"
ogg = "0.9"
vp8-decoder = "0.1"
rusty_vp9 = "0.2"
rav1d = { version = "1.1", default-features = false, features = ["bitdepth_8", "bitdepth_16"] }
theora-rs = "0.1"

# macOS: the app menu, the camera (AVCaptureSession) and audio/video playback from memory (AVPlayer)
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-app-kit = "0.3"
objc2-av-foundation = { version = "0.3", features = ["objc2-core-media"] }
objc2-core-media = "0.3"
objc2-core-video = "0.3"
objc2-core-foundation = "0.3"
block2 = "0.6"
dispatch2 = "0.3"
